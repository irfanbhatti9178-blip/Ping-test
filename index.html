        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        .fullytool-article {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          max-width: 800px;
          margin: 0 auto;
          padding: 40px 24px 80px;
          color: #1e293b;
          line-height: 1.8;
          font-size: 16px;
          -webkit-font-smoothing: antialiased;
        }
        .fullytool-article * { box-sizing: border-box; }
        .ft-meta {
          font-size: 11.5px;
          font-weight: 600;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #64748b;
          margin-bottom: 20px;
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          align-items: center;
        }
        .ft-meta span { display: inline-flex; align-items: center; }
        .ft-meta .dot { width: 3px; height: 3px; background: #cbd5e1; border-radius: 50%; margin: 0 2px; }
        .fullytool-article h1 {
          font-size: 38px;
          line-height: 1.15;
          font-weight: 800;
          letter-spacing: -0.02em;
          color: #0f172a;
          margin: 0 0 20px;
        }
        .fullytool-article h2 {
          font-size: 26px;
          line-height: 1.3;
          font-weight: 700;
          letter-spacing: -0.015em;
          color: #0f172a;
          margin: 56px 0 18px;
          padding-top: 8px;
        }
        .fullytool-article h3 {
          font-size: 18px;
          font-weight: 600;
          color: #1e293b;
          margin: 28px 0 12px;
        }
        .fullytool-article p {
          margin: 0 0 18px;
          color: #334155;
          font-size: 16.5px;
        }
        .fullytool-article a {
          color: #0f172a;
          text-decoration: underline;
          text-underline-offset: 3px;
          text-decoration-color: #cbd5e1;
          font-weight: 500;
        }
        .fullytool-article a:hover { text-decoration-color: #0f172a; }

        /* FAQ */
        .faq-wrap {
          display: grid;
          gap: 12px;
          margin: 24px 0 36px;
        }
        .faq-wrap details {
          border: 1px solid #e2e8f0;
          border-radius: 12px;
          background: #f8fafc;
          padding: 0;
          overflow: hidden;
          transition: all 0.2s;
        }
        .faq-wrap details[open] {
          background: #ffffff;
          border-color: #cbd5e1;
          box-shadow: 0 4px 12px rgba(15,23,42,0.04);

        .faq-wrap summary {

          font-size: 15.5px;

          display: flex;

          color: white;

          font-size: 13px;
